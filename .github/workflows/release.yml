# 推 v* 标签 → 打包 workbuddy-bridge.tgz、生成校验和与更新频道 latest.json、创建 GitHub Release。
#   正式版和 beta（v0.2.0、v0.2.0-beta.1）：标成 latest，latest.json 走 releases/latest/download/，
#     已装的服务器每 6 小时读一次，发现新版本就问用户。（GitHub 的 latest 不认预发布——beta 要是标成预发布，
#     更新频道和 README 里的安装地址就全是 404。）
#   试装版（标签里带 -test，如 v0.2.0-test.1）：发成预发布，不进 latest，用 Release 里附的 workbuddy-prompt.txt 在新服务器上试装。
# 安卓 app（android/）同一次构建：apk 附在 Release 上，也放进安装包的 downloads/，由各台服务器自己提供下载。
#   签名密钥放在仓库的 Actions secrets 里（ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD），
#   没配（比如 fork）就用 debug 签名，照样能装，只是不能覆盖安装官方发布的包。
# 更新内容取带说明的标签（git tag -a v0.2.0 -m "…"）的说明；轻量标签就用最后一次提交的标题。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android app
        env:
          TAG: ${{ github.ref_name }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export MB_KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::没有配置安卓签名密钥，apk 用 debug 签名"
          fi
          # versionCode = 提交数：只增不减，覆盖安装才不会被系统拒
          CODE="$(git rev-list --count HEAD)"
          gradle -p android --no-daemon assembleRelease -PmbVersionCode="$CODE" -PmbVersionName="${TAG#v}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/WorkBuddyBridge.apk
          jq -n --arg name "${TAG#v}" --argjson code "$CODE" --arg sha256 "$(sha256sum dist/WorkBuddyBridge.apk | cut -d' ' -f1)"             '{versionName:$name, versionCode:$code, sha256:$sha256}' > dist/android.json
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Package
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force --tags
          mkdir -p dist/stage
          # git archive 会按 .gitattributes 的 export-subst 把 deploy/workbuddy/VERSION 填成「短哈希 日期」
          git archive --format=tar --prefix=bridge/ HEAD | tar -x -C dist/stage
          # 安卓 app 随安装包走：服务器的 /download/WorkBuddyBridge.apk 读这里（src/routes/android-app.mjs）
          mkdir -p dist/stage/bridge/downloads
          cp dist/WorkBuddyBridge.apk dist/android.json dist/stage/bridge/downloads/
          printf '# 发布频道（发版时写入）\n%s\n' "https://github.com/$REPO/releases/latest/download/latest.json" \
            > dist/stage/bridge/deploy/workbuddy/CHANNEL
          tar -czf dist/workbuddy-bridge.tgz -C dist/stage bridge
          cd dist
          SHA="$(sha256sum workbuddy-bridge.tgz | cut -d' ' -f1)"
          echo "$SHA  workbuddy-bridge.tgz" > workbuddy-bridge.tgz.sha256
          VERSION="$(head -1 stage/bridge/deploy/workbuddy/VERSION)"
          COMMIT="${VERSION%% *}"
          NOTES="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/^-----BEGIN PGP/,$d')"
          [ -n "${NOTES// /}" ] || NOTES="$(git log -1 --format=%s)"
          printf '%s\n' "$NOTES" > notes.md
          jq -n --arg version "$TAG ($VERSION)" --arg commit "$COMMIT" \
            --arg url "https://github.com/$REPO/releases/download/$TAG/workbuddy-bridge.tgz" \
            --arg sha256 "$SHA" --arg notes "$NOTES" --arg released "$(date -u +%FT%TZ)" \
            '{version:$version, commit:$commit, url:$url, sha256:$sha256, notes:$notes, released:$released}' > latest.json
          # 这个版本专用的开场提示词（下载地址钉在本标签上，预发布试装用）
          sed "s|{{BASE}}|https://github.com/$REPO/releases/download/$TAG|g" \
            stage/bridge/deploy/workbuddy/开场提示词.md > workbuddy-prompt.txt
          rm -rf stage
          ls -la

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pre="--latest"; case "$TAG" in *-test*) pre="--prerelease --latest=false" ;; esac
          gh release create "$TAG" dist/workbuddy-bridge.tgz dist/workbuddy-bridge.tgz.sha256 dist/latest.json dist/workbuddy-prompt.txt dist/WorkBuddyBridge.apk \
            --title "$TAG" --notes-file dist/notes.md $pre
